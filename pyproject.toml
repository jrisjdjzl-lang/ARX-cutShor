[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-cutshor"
version = "1.0.0"
description = "Automated YouTube Shorts Production and Publishing Platform"
authors = [{ name = "Abdullah Alasaad" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

