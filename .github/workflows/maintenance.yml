name: Maintenance & State Recovery

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

concurrency:
  group: arx-pipeline-shared-state
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run maintenance and cleanup
        run: python -m arx_cutshor.cli maintenance --max-age 0

